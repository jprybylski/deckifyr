version: 2

updates:
  # pyproject.toml and uv.lock live at the repository root. The Python
  # package source is under inst/python, but Dependabot follows manifests.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"

  # The frontend is a local-only interface whose built assets are committed.
  # Keep vulnerability alerts, but do not open routine version-update PRs.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  # Workflow action updates are exercised directly by the repository's CI.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
