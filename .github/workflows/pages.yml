name: Deploy Docs

# Triggered by release.yaml's own completion (`workflow_run`), not a
# plain `push` -- confirmed the ordering problem this fixes: release.yaml
# also runs on every push to main and, when VERSION has moved, commits
# its own "chore: sync release metadata for X.Y.Z" (bumping DESCRIPTION's
# Version and folding NEWS.md's "(development version)" section into a
# dated one) and pushes that back to main *during its own run*. A plain
# `on: push` trigger here would fire on the original push (deploying the
# site from DESCRIPTION/NEWS.md as they stood *before* that bump) and
# never fire again for the follow-up chore commit, since GitHub doesn't
# re-trigger `push`-based workflows for a push made with the default
# `GITHUB_TOKEN` (the same mechanism that stops release.yaml from
# triggering itself in a loop) -- so the deployed site would silently
# carry stale release metadata indefinitely. `workflow_run` sidesteps
# both problems at once: it fires exactly once per original push,
# strictly after release.yaml's job (chore commit included) has
# finished, regardless of which token made which commit.
#
# `workflow_run` has no `paths:` filter (unlike the `push` trigger this
# replaced), so this now runs on every push to `main` rather than only
# ones touching docs-relevant paths -- release.yaml itself already runs
# unconditionally on every push to `main` with no path filter either, so
# this doesn't add a meaningfully new CI cost, and "never redeploy a
# stale site" is worth more here than skipping an occasional rebuild
# whose content didn't change.
on:
  workflow_run:
    workflows: ["release.yaml"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; let an in-flight one finish rather than cancelling it, since
# cancelling a live Pages deploy mid-upload can leave the site in a half-updated state.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # Manual dispatch always runs; a workflow_run-triggered build only
    # runs if release.yaml actually succeeded and ran on main (it also
    # supports workflow_dispatch itself, e.g. a dry run from a feature
    # branch -- that shouldn't redeploy the live site).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Explicit, not the workflow_run default: we want main's
          # current tip (release.yaml's own chore commit included, if it
          # made one during its run), not the commit that merely
          # triggered release.yaml.
          ref: main

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - uses: r-lib/actions/setup-pandoc@v2

      # Same libuv/libgit2 dependency pyro needs on Ubuntu binary R
      # packages as ci.yml's full-pipeline job and R-CMD-check.yaml --
      # pkgdown::build_site() below loads the deckifyr package (and
      # therefore its Imports: pyro) to build the reference index.
      - name: Install R package system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev libgit2-dev libcurl4-openssl-dev libssl-dev libxml2-dev

      # Identical to R-CMD-check.yaml/test-coverage.yaml/release.yaml's own
      # step -- keep all four in sync if DESCRIPTION's
      # Additional_repositories ever changes. See CLAUDE.md's architecture
      # notes on why the repo-root .Rprofile alone isn't trusted to cover
      # every job/action combination here.
      - name: Add Additional_repositories from DESCRIPTION (pyro via a2-ai.r-universe.dev)
        run: |
          raw <- read.dcf("DESCRIPTION", fields = "Additional_repositories")[1, 1]
          if (!is.na(raw) && nzchar(raw)) {
            repos <- trimws(strsplit(raw, ",")[[1]])
            cat(sprintf("options(repos = c(getOption('repos'), %s))\n", deparse(repos)),
                file = path.expand("~/.Rprofile"), append = TRUE)
          }
        shell: Rscript {0}

      # r-lib's own canonical pkgdown.yaml example workflow
      # (r-lib/actions/examples/pkgdown.yaml) uses exactly this action/needs
      # combination. Previously this step called `pak::pkg_install(...,
      # dependencies = TRUE)` directly -- that recursively pulls every
      # Suggests of every transitive dependency (not just deckifyr's own)
      # and, unlike this action, has no cross-run cache, which made a cold
      # run take 15+ minutes for what R-CMD-check.yaml's own dependency
      # install (same action, same repo) finishes in under a minute.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build pkgdown site
        run: Rscript -e 'pkgdown::build_site(new_process = FALSE, install = FALSE)'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
