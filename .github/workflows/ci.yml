name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    name: python pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `uv run` manages its own ephemeral venv from pyproject.toml, so
      # this needs no manual venv setup and works identically on all
      # three platforms.
      - name: Run tests/python pytest suite
        run: uv run --extra dev pytest tests/python -v

  r-check:
    name: R testthat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      # pyro isn't on CRAN -- it's sourced from a2-ai.r-universe.dev.
      # This action resolves dependencies via `pak`, which (unlike
      # `renv::restore()`, quartifyr's r/ CI mechanism) does NOT read
      # RENV_CONFIG_REPOS_OVERRIDE -- that's renv-specific. pak instead
      # honors DESCRIPTION's `Additional_repositories:` field for
      # `deps::.` resolution (the standard R mechanism for exactly this
      # case, confirmed locally), which is why pyro is declared there
      # rather than passed here as an extra `any::pyro` package -- that
      # form of the spec has no DESCRIPTION to read Additional_repositories
      # from and fails the same way this originally did.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::testthat
          needs: check

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # tests/testthat/test-wiring.R invokes the real pyro/Python bridge
      # and skip()s cleanly if uv or pyro aren't available -- this step
      # exists so that path is actually exercised in CI rather than
      # always skipped.
      - name: Run testthat suite
        run: |
          Rscript -e 'devtools::load_all("."); testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
