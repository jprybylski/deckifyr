[project]
name = "deckifyr"
version = "0.0.0.dev0"
description = "Declarative, code-first PowerPoint compiler for Quarto content and reportifyr artifacts"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = [
    "python-pptx>=1.0",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyarrow>=14.0",
    "pymupdf>=1.24",
    # `deckifyr.web` (spec section 12) needs fastapi/uvicorn -- see the
    # `web` extra below. Folded into `dev` too so `tests/python/
    # test_web.py` can exercise it with a plain `--extra dev`, the same
    # "dev also pulls in every lazily-imported extra so the full test
    # suite runs from one install" pattern `tables`/`quarto`/`preview`
    # already establish above.
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx2>=2.10.0",
]
# `deckifyr.resolvers.table.TableResolver` imports pyarrow lazily, only
# for `.parquet` sources -- a project using only CSV tables never pays
# for it. `dev` also pulls this in so `tests/python` can exercise the
# Parquet path.
tables = [
    "pyarrow>=14.0",
]
# `deckifyr.renderers.quarto` imports pymupdf lazily, only to rasterize a
# `type: quarto` element rendered with `render_mode: svg`/`png` (spec
# section 8.1) -- a project using only `render_mode: native` quarto
# elements, or none at all, never pays for it. Rendering still requires
# the external `quarto` binary itself (not a pip dependency, spec
# section 14's manifest records its version) -- `dev` also pulls this in
# so `tests/python` can exercise the svg/png path wherever `quarto` is
# actually installed (see test_renderers_quarto.py's skip pattern,
# mirroring tests/testthat/test-wiring.R's own uv/pyro skip).
quarto = [
    "pymupdf>=1.24",
]
# `deckifyr.renderers.preview` imports pymupdf lazily too, to rasterize
# the PDF LibreOffice produces (`deckifyr preview`/`build.previews:
# true`, spec section 12/18 Phase 3) -- a project that never previews
# never pays for it. Rendering still requires the external `soffice`
# binary itself (not a pip dependency) -- `dev` also pulls this in so
# `tests/python` can exercise the render path wherever `soffice` is
# actually installed (see test_renderers_preview.py's skip pattern,
# mirroring test_renderers_quarto.py's own quarto-binary skip).
preview = [
    "pymupdf>=1.24",
]
# Unused until Phase 3 (spec section 12) -- declared now so the extras
# name is stable and doesn't need to be invented later.
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
deckifyr = "deckifyr.cli:main"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# The Python source is canonical under inst/python/ so it can be bundled
# unmodified inside the R package (spec section 5.3/5.4) -- this is the
# only place that path mapping is declared, don't duplicate it.
where = ["inst/python"]
include = ["deckifyr*"]

[tool.setuptools.package-data]
# The built frontend (web/, spec section 12) -- a real Node build step,
# which neither the wheel build nor an R package install can run, so
# the built assets are committed to git (see web/vite.config.ts's own
# comment) and just need including here so the wheel actually ships
# them alongside deckifyr.web.app's StaticFiles mount.
"deckifyr.web" = ["static/**/*"]
# Static JSON Schema files for IDE YAML tooling (issue #49) --
# generated by scripts/generate_json_schemas.py from the same pydantic
# models `deckifyr schema`/`deck_schema()` already dump on demand, kept
# evergreen by tests/python/test_json_schema_files.py rather than by
# hand verification.
#
# Bundled coding-agent skill files (issue #50) -- hand-authored
# Claude Skills-format SKILL.md content the `deckifyr skills`/
# `deck_export_skills()` command copies into a target directory, kept
# structurally evergreen by tests/python/test_skills_content.py.
"deckifyr" = ["schemas/*.schema.json", "skills/*/SKILL.md"]
# The bundled R script deckifyr.renderers.flextable shells out to via
# Rscript (issue #57) to rasterize a reportifyr .rds flextable artifact
# to a PNG -- located at runtime via Path(__file__).resolve().parent,
# the same pattern deckifyr.web.app's static-dir lookup and cli.py's
# _skills_dir() already use for their own bundled non-.py files.
"deckifyr.renderers" = ["render_flextable.R"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
