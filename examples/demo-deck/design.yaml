deckifyr: "0.1"

slide:
  width: 13.333in
  height: 7.5in
  background: "#FFFFFF"
  safe_area: 0.35in

fonts:
  body: Arial
  heading: Arial
  monospace: Consolas

colors:
  text: "#202124"
  muted: "#5F6368"
  primary: "#2457A6"
  accent: "#D14D32"

text_styles:
  title:
    font: heading
    size: 28pt
    bold: true
    color: primary
  subtitle:
    font: body
    size: 18pt
    italic: true
    color: muted
  body:
    font: body
    size: 16pt
    color: text
  footnote:
    font: body
    size: 8pt
    color: muted

defaults:
  overflow: error
  image_fit: contain
  rotation: 0
  # A reportifyr footer (spec section 9.1) reuses the same small, muted
  # style the demo already uses for the table -- no separate footer
  # typography convention to invent.
  footer_style: footnote

# Document furniture (spec section 7.8): a branding label and running
# page number, composed on every slide without hand-placing either one --
# see this file's shape names in the compositor's output
# (`__furniture_branding`, `__furniture_page_number`).
furniture:
  branding:
    text: Deckifyr Demo
    box: {x: 0.35in, y: 7.05in, width: 4in, height: 0.3in}
    style: footnote
  page_number:
    format: "{page} / {total}"
    box: {x: 5.5in, y: 7.05in, width: 1in, height: 0.3in}
    style: footnote
