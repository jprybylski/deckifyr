# yaml-language-server: $schema=../../inst/python/deckifyr/schemas/presentation.schema.json
# A working demo, in the spirit of quartifyr's examples/demo-report: a
# small PK-style deck built from a real reportifyr artifact rather than
# placeholder content. `OUTPUTS/figures/conc-time.png` and its metadata
# sidecar are copied straight from quartifyr's examples/demo-report/
# (scripts/01_analysis.R, the same Theoph-derived concentration-time
# figure that report's own `.qmd` fills via a `{rpfy}:` magic string).
#
# The `figure` element below resolves `{rpfy}:conc-time.png` through
# `deckifyr.resolvers.ReportifyrResolver` (spec section 9) against
# `OUTPUTS/figures/` and its metadata sidecar, and renders that
# sidecar's footnote content as a footer beneath the figure (the
# default `footer_placement: below` -- see this repo's
# deckifyr-specification.md section 9.1 and standard_footnotes.yaml in
# this directory for where the footer text comes from).
#
# OUTPUTS/tables/pk-summary.csv is a per-participant summary (weight, dose,
# Cmax, Tmax) derived from that same Theoph dataset, exercising the
# `table` element type and `deckifyr.resolvers.TableResolver` (spec
# section 9.2).
#
# The `pk-interpretation` slide's `figure`/`note` elements are both
# `type: quarto` (spec section 8.1, issue #3), reusing the same
# `plot-with-note` layout zones the `concentration-time` slide's
# reportifyr figure/markdown note already fill -- a `quarto` element
# slots into an ordinary layout zone exactly like any other content
# type. `fragments/elimination-equation.qmd` has no executable code, so
# it needs only the `quarto`/Typst toolchain to render its display math
# to `render_mode: png` (spec section 8's own "helpful for eg equations"
# motivation, issue #3). `fragments/half-life-narrative.qmd` executes a
# real R code chunk against the same built-in `Theoph` dataset the
# figure and table above already use, fitting a simple log-linear
# elimination model per participant -- `render_mode: native` is set
# explicitly rather than left at `auto`, since `auto` would pick `png`
# for a fragment with a code chunk (`deckifyr.renderers.quarto
# .select_auto_render_mode`'s heuristic) but this chunk's own output is
# just a short computed sentence, better left as real editable text.
#
# The `table-formats` slide (issue #57) puts a `{rpfy}:`-sourced native
# table and a `{rpfy}:`-sourced `.rds` flextable side by side, each with
# its own footer, to make the two reportifyr table paths concrete:
# `{rpfy}:pk-summary.csv` (`type: table`, `deckifyr.resolvers
# .TableResolver`) resolves to a real, editable PowerPoint table, while
# `{rpfy}:pk-flextable-summary.rds` (`type: reportifyr`) is an R
# `flextable` object (see OUTPUTS/tables/pk-flextable-summary.rds and
# scripts/generate_pk_flextable.R) with per-cell formatting -- a merged
# header, a highlighted row -- that a native table can't represent, so
# it's rendered to a transparent-background picture by
# `deckifyr.renderers.flextable` instead.
deckifyr: "0.1"
design:
  base: design.yaml
layouts: layouts.yaml

metadata:
  title: Theophylline PK Summary
  author: Deckifyr
  status: demo

build:
  strict: true
  output: build/demo-deck.pptx
  manifest: build/demo-deck.manifest.json
  previews: false
  reportifyr:
    standard_footnotes: standard_footnotes.yaml

# Selects one of design.yaml's furniture.status placements (spec
# section 7.8) -- nothing is on by default there, so an organization
# base design doesn't force every deck built from it into a draft
# watermark. `status_indicator: watermark` picks the full, diagonal,
# on-top placement design.yaml's own furniture.status.watermark
# configures (box/style/rotation/z_index); `corner-tr`/`corner-tl`/
# `corner-bl`/`corner-br` would pick one of the four simpler corner
# placements instead (design.yaml also configures `corner_br`, as an
# example, though this build doesn't select it).
#
# No top-level `watermark:` field here -- it's left unset on purpose, so
# the mark's text falls back to `metadata.status` above ("demo"), which
# `design.yaml`'s `watermark` text_styles entry then uppercases
# (`text_transform: uppercase`) into "DEMO". Setting `watermark:` here
# explicitly would override that fallback with different text entirely.
status_indicator: watermark

slides:
  - id: title
    layout: blank
    elements:
      - id: deck-title
        type: markdown
        value: "# Theophylline PK Summary"
        box: {x: 0.9in, y: 2.4in, width: 11.5in, height: 1.1in}
        render_mode: native
        style: title
      - id: deck-subtitle
        type: markdown
        value: "*Concentration-time profiles from the built-in Theoph dataset*"
        box: {x: 0.9in, y: 3.55in, width: 11.5in, height: 0.6in}
        render_mode: native
        style: subtitle

  - id: concentration-time
    layout: plot-with-note
    notes: |
      Point out the rapid absorption phase in the first 1-2 hours, then the
      slower elimination tail. No PK modeling is shown here -- this is the
      raw observed data only.
    elements:
      title:
        value: Concentration-Time Profile
      figure:
        type: reportifyr
        value: "{rpfy}:conc-time.png"
        fit: contain
        alt_text: >-
          Line plot of theophylline serum concentration over time for each
          of the 12 participants in the Theoph dataset, showing a rapid
          rise to peak concentration within the first few hours followed
          by a gradual decline.
      note:
        type: markdown
        value: |
          **Data source**

          Data are from the built-in *Theoph* dataset, produced by reportifyr's two-pass pipeline (see quartifyr's demo-report example).

          Each line traces one participant's observed PK profile after a single oral dose; no model-based estimation was performed.
        render_mode: native
        style: body

  - id: pk-interpretation
    layout: plot-with-note
    elements:
      title:
        value: Elimination Half-Life
      figure:
        type: quarto
        source: fragments/elimination-equation.qmd
        render_mode: png
        alt_text: >-
          First-order elimination equation: concentration at time t equals
          the initial concentration times e to the power of negative the
          elimination rate constant times t; half-life equals the natural
          log of 2 divided by the elimination rate constant.
      note:
        type: quarto
        source: fragments/half-life-narrative.qmd
        render_mode: native
        style: body

  - id: pk-summary
    layout: blank
    elements:
      - id: table-title
        type: text
        value: Per-Participant PK Summary
        box: {x: 0.9in, y: 0.5in, width: 11.5in, height: 0.65in}
        style: title
      - id: pk-table
        type: table
        source: OUTPUTS/tables/pk-summary.csv
        box: {x: 0.9in, y: 1.35in, width: 11.5in, height: 5.0in}
        style: table-body
        table_style: pk-summary
        alt_text: >-
          Table of weight, dose, peak concentration, and time to peak
          concentration for each of the 12 participants in the Theoph
          dataset.

  - id: table-formats
    layout: blank
    elements:
      - id: table-formats-title
        type: text
        value: "Reportifyr Table Formats: Native vs. Flextable"
        box: {x: 0.9in, y: 0.5in, width: 11.5in, height: 0.65in}
        style: title
      - id: raw-table
        type: table
        source: "{rpfy}:pk-summary.csv"
        # Wide enough that the "Participant" header cell doesn't wrap to
        # two lines -- a narrower box left the rendered table taller than
        # its own declared box (row heights auto-grow to fit wrapped
        # text), which pushed real content down into the footer text
        # below it. Verified against a real LibreOffice-rendered preview,
        # not assumed.
        box: {x: 0.6in, y: 1.35in, width: 7.6in, height: 4.3in}
        style: table-body
        table_style: pk-summary
        footer_placement: below
        alt_text: >-
          Table of weight, dose, peak concentration, and time to peak
          concentration for each of the 12 participants in the Theoph
          dataset.
      - id: flextable-summary
        type: reportifyr
        value: "{rpfy}:pk-flextable-summary.rds"
        fit: contain
        # The rendered flextable PNG is wide and short (~3.26:1) -- a box
        # close to that aspect ratio keeps the footer right beneath the
        # visible picture instead of `fit: contain` leaving a tall,
        # mostly-empty gap above a footer anchored to the box's own
        # (much taller) bottom edge.
        box: {x: 8.5in, y: 1.35in, width: 4.2in, height: 1.45in}
        footer_placement: below
        alt_text: >-
          A formatted summary table of mean, median, minimum, and maximum
          weight, dose, peak concentration, and time to peak concentration
          across all 12 participants, with a merged "Population Summary"
          header and the mean row highlighted.

  - id: closing
    layout: null
    elements:
      - id: closing-title
        type: text
        value: Generated with deckifyr
        box: {x: 0.9in, y: 2.7in, width: 11.5in, height: 0.9in}
        style: title
      - id: closing-note
        type: markdown
        value: |
          This deck was compiled entirely from version-controlled YAML in this directory -- design.yaml, layouts.yaml, and presentation.yaml -- with **no manual slide editing**.
        box: {x: 0.9in, y: 3.7in, width: 11.5in, height: 1.3in}
        style: body
      - id: logo
        type: image
        source: assets/logo.png
        fit: contain
        alt_text: Organization logo
        box: {x: 10.6in, y: 6.55in, width: 2.0in, height: 0.7in}
        rotation: -3
        z_index: 1
